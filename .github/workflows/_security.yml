name: Security and dependency health (reusable)

# Runs on every PR and push to main (called from ci.yml) and weekly (security.yml), so vulnerabilities
# disclosed after a package was merged are still caught. Policy: docs/07-engineering-process/vulnerability-management.md

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-deps:
    name: Backend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
        working-directory: backend
      - name: Lock matches pyproject, packages compatible, pip-audit clean
        run: python3 scripts/check_deps.py backend

  frontend-deps:
    name: Frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: pnpm audit (high and critical) and strict peer resolution from scratch
        run: python3 scripts/check_deps.py frontend

  # Didactic example of the Wiz CLI. Real organisations normally rely on the Wiz GitHub connector instead
  # (no workflow step needed); see the vulnerability-management doc. This job is skipped until a repository
  # variable WIZ_ENABLED=true exists and the `wiz` environment holds WIZ_CLIENT_ID and WIZ_CLIENT_SECRET.
  wiz:
    name: Wiz CLI scan
    if: >-
      ${{ vars.WIZ_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: wiz
    env:
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      WIZ_POLICY: ${{ vars.WIZ_POLICY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Verify the download URL, the checksum procedure and every wizcli flag below against your Wiz
      # administrator's documentation: CLI syntax and versions change.
      - name: Install Wiz CLI
        run: |
          curl -fsSL -o wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli
      - name: Authenticate
        run: ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"
      - name: Scan source (dependencies and secrets)
        run: ./wizcli dir scan --path . --policy "$WIZ_POLICY"
      - name: Scan the backend image
        run: |
          docker build -t ai-first-backend:wiz backend
          ./wizcli docker scan --image ai-first-backend:wiz --policy "$WIZ_POLICY"
      - name: Scan infrastructure as code (when present)
        run: |
          if [ -d infra ]; then
            ./wizcli iac scan --path infra --policy "$WIZ_POLICY"
          else
            echo "No infra/ folder yet; skipping IaC scan"
          fi
