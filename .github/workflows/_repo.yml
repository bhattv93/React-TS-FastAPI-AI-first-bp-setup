name: Repo hygiene (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npx --yes markdownlint-cli2@0.24.0

  ai-policy:
    name: AI policy (MCP servers, plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_ai_policy.py
      - run: python3 scripts/check_ai_config.py

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose

  meta:
    name: Workflow lint and PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:latest -color
      - name: PR title is a conventional commit ending with the Jira key
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|chore|ci|build|perf)(\([a-z0-9-]+\))?!?: .+ \(AIFS-[0-9]{4}\)$'
          if ! [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must look like: feat(scope): summary (AIFS-0001)"
            echo "Got: $PR_TITLE"
            exit 1
          fi
