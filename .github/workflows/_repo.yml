name: Repo hygiene (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npx --yes markdownlint-cli2@0.24.0

  ai-policy:
    name: AI policy (MCP servers, plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_ai_policy.py
      - run: python3 scripts/check_ai_config.py

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --verbose

  meta:
    name: Workflow lint and PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The Claude hook only guards the agent's edit tools; this check guards everyone.
      - name: Applied Flyway migrations are never modified, renamed or deleted
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/$BASE_REF...HEAD" -- backend/db/migrations)
          if [ -n "$changed" ]; then
            echo "Applied Flyway migrations are immutable. Add a new migration instead. Changed:"
            echo "$changed"
            exit 1
          fi
      - name: actionlint
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      # Dependabot titles ("chore(deps): Bump x from 1 to 2") cannot carry a Jira key, so its pull
      # requests are exempt. The check keys on the PR author, not the actor, so a person clicking
      # "Update branch" on a Dependabot PR does not turn it red.
      - name: PR title is a conventional commit ending with the Jira key
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|chore|ci|build|perf)(\([a-z0-9-]+\))?!?: .+ \(AIFS-[0-9]{4}\)$'
          if ! [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must look like: feat(scope): summary (AIFS-0001)"
            echo "Got: $PR_TITLE"
            exit 1
          fi
