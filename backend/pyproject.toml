[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-first-backend"
version = "0.1.0"
description = "FastAPI backend of the AI-first React-TS + FastAPI boilerplate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "black>=24.10",
    "isort>=5.13",
    "pylint>=3.3",
    "mypy>=1.13",
    "diff-cover>=9.2",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------
# Quality gates (see docs/05-quality-gates.md)
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]
src_paths = ["src", "tests"]

[tool.pylint.main]
py-version = "3.13"
load-plugins = [
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
]
jobs = 0
ignore-paths = ["^tests/.*$"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.parameter_documentation]
default-docstring-type = "numpy"
accept-no-param-doc = false
accept-no-raise-doc = false
accept-no-return-doc = false
accept-no-yields-doc = false

[tool.pylint."messages control"]
# Pydantic / SQLAlchemy models legitimately have no public methods.
disable = ["too-few-public-methods"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
markers = [
    "ac(key, id): links a test to a Jira acceptance criterion, e.g. @pytest.mark.ac('AIFS-0001', 'AC-1')",
    "integration: needs Docker (Postgres via Testcontainers); skipped automatically when Docker is unavailable",
]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
